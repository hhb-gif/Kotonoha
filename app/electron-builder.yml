# electron-builder 配置：NSIS 安装包 + 便携版
appId: com.kotonoha.app
productName: Kotonoha
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
asar: true
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Kotonoha
