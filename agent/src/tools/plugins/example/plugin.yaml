# ============================================================
# plugin.yaml —— 插件清单（示例插件）
# 放在 agent/tools/plugins/<插件名>/ 目录下，与 index.ts 同目录
# 字段说明：
#   name        插件名（必填，唯一标识；建议与目录名一致）
#   version     版本号（可选）
#   description 一句话描述（可选）
#   tools       声明本插件注册的工具名列表（可选，用于披露/校验）
#   hooks       声明本插件注册的钩子 id 列表（可选）
# ============================================================
name: example
version: 1.0.0
description: 示例插件：展示插件协议完整写法（ctx.registerTool）
tools:
  - example_echo