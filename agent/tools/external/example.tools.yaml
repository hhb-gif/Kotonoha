# ============================================================
# example.tools.yaml —— 配置驱动外接工具示例（T2-external）
# 放到 <agent>/tools/external/ 目录下即被自动加载（无需写任何代码）
# 命名：tool.yaml 或 *.tools.yaml 均可被识别（如 weather.tools.yaml）
#
# 语法要点：
#   - 顶层 `tools:` 下用 "- name: ..." 声明每个工具
#   - 每个工具必须：name（唯一）、type（shell / http）
#   - 模板里的 {arg} 占位符 → 自动生成 JSON Schema 参数（全 string）
#   - 密钥/环境变量用 {env:VAR} 占位符，运行时从 process.env 读取，
#     不会把明文写进配置文件
#   - 含 {arg} / {env:VAR} 的值请用双引号包裹（否则可能被解析成内联 map）
#   - 支持内联 map：headers: { Authorization: "Bearer {env:TOKEN}" }
#
# 类型：shell（执行命令） / http（调用 HTTP API）
# ============================================================

tools:
  # ---------- 示例 1：shell 工具 ----------
  # 生成 schema：{text} 占位符 → 参数 text（string）
  # 执行：exec("echo <text>")，cwd 相对本文件目录，stdout 即结果
  - name: ext_echo
    description: 回显文本（配置驱动 shell 工具示例）
    type: shell
    command: "echo {text}"
    cwd: .          # 工作目录（相对本配置文件所在目录；缺省同目录）
    timeout: 10     # 超时秒数（可选，缺省 60）

  # ---------- 示例 2：http 工具（GET，公开 API，无需密钥）----------
  # 生成 schema：{owner} / {repo} 两个参数
  # 调用：GET https://api.github.com/repos/<owner>/<repo>
  - name: ext_github_repo
    description: 查询 GitHub 仓库基本信息（配置驱动 HTTP 工具示例）
    type: http
    method: GET
    url: "https://api.github.com/repos/{owner}/{repo}"
    timeout: 15

  # ---------- 示例 3：http 工具（POST，带密钥）----------
  # 密钥不落明文：先 export GITHUB_TOKEN=xxx，再调用本工具
  # {env:GITHUB_TOKEN} 运行时从环境变量读取（缺失时报错提示）
  # body 支持内联 map：{title} / {body} 自动成为参数
  - name: ext_github_issue
    description: 创建 GitHub issue（需环境变量 GITHUB_TOKEN）
    type: http
    method: POST
    url: "https://api.github.com/repos/{owner}/{repo}/issues"
    headers: { Authorization: "Bearer {env:GITHUB_TOKEN}" }
    body: { title: "{title}", body: "{body}" }
    timeout: 15

  # ---------- 更多示例（注释掉，按需启用）----------
  #
  # 天气查询（shell + 参数 + cwd 子目录）：
  # - name: ext_weather
  #   description: 查天气
  #   type: shell
  #   command: "python scripts/weather.py {location}"
  #   cwd: scripts
  #   timeout: 30